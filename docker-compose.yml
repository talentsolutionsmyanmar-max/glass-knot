# Optional — judges can use uvicorn directly.
services:
  glass-knot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - NANSEN_API_KEY=${NANSEN_API_KEY:-}
      - TRADE_VALUE_USD_MIN=${TRADE_VALUE_USD_MIN:-1000}
      - POLL_INTERVAL_SEC=${POLL_INTERVAL_SEC:-60}
      - HOST=0.0.0.0
      - PORT=8765
    ports:
      - "8765:8765"
    command: >
      bash -c "pip install -q -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8765"
